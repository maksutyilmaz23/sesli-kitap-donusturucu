name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Ensure Kotlin plugin present
        run: |
          if ! grep -q "org.jetbrains.kotlin.android" android/build.gradle; then
            sed -i "s/id 'com.android.application' version '\\S*' apply false/&\n    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false/" android/build.gradle || true
          fi
          if ! grep -q "org.jetbrains.kotlin.android" android/app/build.gradle; then
            sed -i "/id 'com.android.application'/a\\    id 'org.jetbrains.kotlin.android'" android/app/build.gradle
          fi
          if ! grep -q "kotlin-stdlib" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            printf '\ndependencies {\n    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"\n}\n' >> android/app/build.gradle
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sesli-kitap-donusturucu.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sesli Kitap Dönüştürücü build ${{ github.run_number }}
          files: sesli-kitap-donusturucu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
